name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run docs:build

      - name: "Setup Pages - if this fails, set Settings > Pages > Source = GitHub Actions"
        uses: actions/configure-pages@v4
        with:
          # Enable (and provision, if needed) the Pages site for this repository
          # instead of only performing a read-only site lookup. With the default
          # `enablement: false` this action only LOOKS the site up, so a
          # repository without a Pages site fails with a bare 404.
          #
          # Residual repository setting (outside this workflow's authority):
          # GitHub Pages must be provisioned for this repository with
          #   Settings > Pages > Build and deployment > Source = "GitHub Actions"
          # If the token is not allowed to create Pages sites, that setting has
          # to be applied in the repository settings.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
