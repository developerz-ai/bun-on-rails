name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance
  actions: read # bin/qa-release bar 4 reads the CI runs on main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Tag matches package.json version
        id: pkg
        run: |
          name=$(bun -e 'console.log(require("./package.json").name)')
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Release bar (bin/qa-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/qa-release "$GITHUB_WORKSPACE"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      # No token: npm authenticates with the workflow's OIDC identity, which the
      # package's trusted-publisher setting on npmjs.com must name (plan 101, D7).
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Generate changelog
        id: changelog
        run: |
          # The first release has no earlier tag: start from the root commit.
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "CHANGELOG<<EOF"
            git log "${prev}..HEAD" --pretty=format:"- %s"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation
            ```bash
            bun add -g ${{ steps.pkg.outputs.name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
